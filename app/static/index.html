<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustVault</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">TrustVault</div>
    <div id="who" class="who hidden"></div>
  </header>
  <main>
    <section id="login" class="card narrow">
      <h1>Sign in</h1>
      <p class="muted">Secure document sharing with a provable audit trail.</p>
      <form id="login-form">
        <label>Email<input id="email" type="email" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
        <p id="login-msg" class="msg error" role="alert"></p>
      </form>
    </section>
    <section id="app" class="hidden">
      <nav id="tabs" class="tabs"></nav>
      <p id="msg" class="msg" role="status"></p>
      <div id="view"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
